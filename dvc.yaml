stages:
  data_ingestion:
    cmd: python src/1_data_ingestion.py
    deps:
      - src/1_data_ingestion.py
      - params.yaml
    outs:
      - artifacts/data/raw/train.csv
      - artifacts/data/raw/test.csv

  data_preprocessing:
    cmd: python src/2_data_preprocessing.py
    deps:
      - artifacts/data/raw/train.csv
      - artifacts/data/raw/test.csv
      - src/2_data_preprocessing.py
    outs:
      - artifacts/data/processed/train_processed.csv
      - artifacts/data/processed/test_processed.csv

  text_vectorization:
    cmd: python src/3_feature_engineering.py
    deps:
      - artifacts/data/processed/train_processed.csv
      - artifacts/data/processed/test_processed.csv
      - src/3_feature_engineering.py
      - params.yaml
    outs:
      - artifacts/data/vectorized/train_vectorized.csv
      - artifacts/data/vectorized/test_vectorized.csv
      - artifacts/data/vectorized/vectorizer.pkl

  model_trainer:
    cmd: python src/4_model_trainer.py
    deps:
      - artifacts/data/vectorized/train_vectorized.csv
      - src/4_model_trainer.py
      - params.yaml
    outs:
      - artifacts/model/logistic_regression_model.pkl

  model_evaluation:
    cmd: python src/5_model_evaluation.py
    deps:
      - artifacts/data/vectorized/test_vectorized.csv
      - artifacts/model/logistic_regression_model.pkl
      - src/5_model_evaluation.py
      - params.yaml
    outs:
      - reports/metrics.yaml
      - reports/experiment_info.json


  model_registry:
    cmd: python src/6_register_model.py
    deps:
      - reports/experiment_info.json
      - src/6_register_model.py